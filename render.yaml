services:
  # Web Service (Nexus Real-Time Node.js App)
  - type: web
    name: nexus-platform
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --prefix server && npm --prefix server run build && npm install --include=dev --prefix client && npm --prefix client run build
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  # Managed PostgreSQL Database on Render
  - name: nexus-db
    databaseName: nexus
    user: nexus_user
    plan: free
