services:
  # Web Service (Nexus Real-Time Node.js App)
  - type: web
    name: nexus-platform
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix server run build && npm --prefix client install && npm --prefix client run build
    startCommand: npm --prefix server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  # Managed PostgreSQL Database on Render
  - name: nexus-db
    databaseName: nexus
    user: nexus_user
    plan: free
