# Coturn STUN and TURN Server Configuration for WebRTC
# Listening Ports
listening-port=3478
tls-listening-port=5349

# Relay IP / Min-Max UDP ports
min-port=49152
max-port=49200

# Authentication mechanism
lt-cred-mech
user=nexus_user:nexus_turn_password_2026
realm=nexus.app

# Security options
fingerprint
no-cli
no-tcp-relay
no-multicast-peers

# Logging
verbose
log-file=stdout
